# REDUCED-SCALE profile (DECISIONS D19; amendments in docs/prereg/): same design as
# configs/traces.yaml with half the instances per template.
profile: reduced
# GSM-Symbolic CoT traces shared by Baseline B and the Phase 3 pilot.
# Pre-registration: docs/prereg/phase0.md (data), baseline_b.md, pilot.md
harness_config: "configs/gemma2_2b.yaml"
out_dir: "results/traces"
seed: 42
split_fractions: { train: 0.5, dev: 0.2, test: 0.3 }   # template-grouped
instances_per_template: 4   # REDUCED (full: 8)
variants: ["main", "noop"]
chunk_size: 64          # traces per resumable generation chunk
extract_chunk: 64       # traces per activation shard (~1 GB of fp32 in RAM per shard)
parse_sample_size: 30   # steps dumped for manual inspection (phase 0.3)
