# Top-level pilot experiment config: wires model/dataset/sae/segmentation
# configs together and sets output paths. Maps to synopsis experiment E1
# (pilot feasibility) -- see docs/PROGRESS.md for the E1/E2 mapping table.
name: "pilot_qwen05b_gsm8k50"
seed: 42

model_config: "configs/legacy/model.yaml"
dataset_config: "configs/dataset.yaml"
sae_config: "configs/legacy/sae.yaml"
segmentation_config: "configs/legacy/segmentation.yaml"

output_dir: "results/legacy_pilot"
traces_file: "results/legacy_pilot/traces.jsonl"
activations_cache: "results/legacy_pilot/activations"
sae_features_cache: "results/legacy_pilot/sae_features"
segmentation_output: "results/legacy_pilot/segmentation.jsonl"
taxonomy_output: "results/legacy_pilot/taxonomy.csv"
metrics_output: "results/legacy_pilot/metrics.json"

annotation:
  n_traces_to_annotate: 20
  annotation_file: "results/legacy_pilot/annotations.json"
  taxonomy_manual_check_fraction: 0.2
