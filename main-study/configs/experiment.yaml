# Consolidated configuration (plan Appendix E, Table 25).
# Values marked `provisional: true` are fixed in the pre-registration of the experiment that uses them.

generation:
  greedy:
    temperature: 0.0
    do_sample: false
    repetition_penalty: 1.0   # explicitly disabled; never inherit a model default
    top_p: null
    top_k: null
    batch_size: 1             # harness.generate (M0 / S1); the minor-project runs use `batched`
    max_new_tokens: 512       # fixed for S2-S4 (prereg/S2.md amendment A3; the 1024 draft is withdrawn)
  batched:                    # prereg/S2.md amendment A2 (DECISIONS D22)
    engine: hf_batched        # HF generate + KV cache, float32, eager attention; fallback: tl
    batch_size: 16            # hardware setting (T4, float32); halved automatically on out-of-memory
    padding: left
    stop_at_answer_line: true # amendment A3: stop at the end of the answer line
  sampled_subset:
    temperature: 0.7
    k: 5
    do_sample: true
    population: test_failures # amendment A5: greedy failures on test templates only
  prompt_styles: [marked, terse]
  paraphrases_per_style: 3

scope:                               # prereg/S2.md amendment A1 (DECISIONS D21)
  minor_project_models: [gemma-2-2b-it]
  semester8_replication_models: [gemma-2-9b-it, qwen2.5-7b-instruct]   # RQ8

data:
  instances_per_template: 8          # amendment A6: from the power analysis below (4 in D19's reduced run)
  n_templates: 97                    # amendment A6; see the open item on gold coverage in prereg/S2.md
  power:                             # synopsis "Power analysis"; amendment A6
    planning_accuracy: 0.71          # observed on Gemma-2-2B-IT in M0 (GSM8K train)
    planning_s0_rate: 0.81           # lower end of M0's 81-92% of failures with an error step
    n_after_holm: 213                # McNemar 15% vs 5%, 80% power, Holm over five comparisons
    max_absorbed_deff: 1.5           # 320 = 213 x 1.5
    min_test_failures: 320
  template_split:                    # by template; test >= 40 templates
    train: 40
    dev: 20
    test: 40
    provisional: true
  min_test_failures: 320
  min_test_templates: 40

probing:
  positions: [step_first, step_last, final_answer]   # step_first is primary
  primary_position: step_first
  regularisation:
    penalty: l2
    lambda_grid_exponents: [-4, -3, -2, -1, 0, 1, 2]   # lambda = 10^k
    provisional: true
  cv_folds: 5                       # grouped by template
  shuffled_label_permutations: 100  # within template groups
  seeds: [0, 1, 2, 3, 4]

statistics:
  bootstrap_resamples: 10000        # template-clustered
  ci: 0.95
  fdr_q: 0.05                       # Benjamini-Hochberg
  e0_correction: holm               # across depth bands

thresholds:
  sae_fvu_max: 0.40
  sae_delta_ce_max: 0.20            # nats per token
  rq1_min_score: 0.75               # held-out balanced accuracy / AUROC, and above shuffled
  rq2_alarm_fpr: 0.10               # provisional
  rq3_min_top1_gold: 0.20           # D_V >= 0.20 and G_V > max(G_shuf, G_prior)
  stable_failure: "no sampled run correct"   # provisional
  kappa_min: 0.6

annotation:
  fraction: 0.20
  annotators: 2

verification:                       # amendment A2: TL teacher forcing on the HF batched traces
  per_template: 3                    # stratified by template: 3 x 97 = 291 traces (>= min_sample)
  min_sample: 200
  seed: 0
  threshold_key: teacher_forced_reproduction_min   # the Phase 0 / S1b threshold, unchanged
  logit_chunk: 128                   # positions per unembedding chunk (memory only)
  tl_n_devices: 1                    # one TL copy per T4; 2 = split over both (M0 fallback)

cache:                               # amendment A4
  site: residual                     # blocks.0.hook_resid_pre + blocks.{l}.hook_resid_post, all l
  positions_from: probing.positions
  storage_dtype: float16             # storage only; computation stays float32
  rows_per_shard: 2048
  fp16_check_traces: 32              # float32 copies kept and compared

budget:
  max_t4_gpu_hours: 25               # above this, `make estimate` proposes a cut instead of running
  estimate_safety_factor: 1.25

equivalence_checks:                 # Table 5; errors are relative (||a-b|| / ||b||)
  resid_max_rel_err: 0.01
  top1_agreement_min: 0.99
  padded_vs_single_max_rel_err: 0.01
  teacher_forced_reproduction_min: 0.99
  bos_tokens_per_prompt: 1
